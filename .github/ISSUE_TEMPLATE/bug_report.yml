name: 不具合の報告
description: ツイタテで起きた問題を知らせる
title: "[不具合] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 閲覧したサイトの一覧・メールアドレスなど、個人の情報は書かないでください。
  - type: input
    id: version
    attributes:
      label: バージョン / ビルド
      description: 設定の一番下に出る値
      placeholder: 0.1.0 / 22
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 端末 / OS
      placeholder: iPhone 16 Plus / iOS 27.0
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 起きたこと
      description: どの画面で何をしたら、どうなったか
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 本来どうなってほしいか
